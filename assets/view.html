{% extends "challenge.html" %}

{% block description %}
    {{ super() }}
    <div class="container-action-area mt-4">
        <hr>
        <div id="container-request-div" class="text-center">
<button type="button" class="btn btn-success w-100" id="container-request-btn"
    onclick="container_request({{ challenge.id }})">
    <i class="fas fa-play"></i> Ottieni dettagli connessione
</button>
        </div>

		<br>

        <div id="container-request-result" style="display: none;" class="alert alert-info text-center">
            <div class="mb-2">
                <strong>Info connessione:</strong><br>
                <code id="container-connection-info" style="font-size: 1.2em;"></code>
            </div>
            <div class="mb-3">
                <small>Scade tra <span id="container-expires"></span> minutes (<span id="container-expires-time"></span>)</small>
            </div>
            <div class="btn-group w-100" role="group">
                <button type="button" class="btn btn-sm btn-warning" id="container-reset-btn" onclick="container_reset({{ challenge.id }})">
    <i class="fas fa-sync"></i> Reset
</button>
<button type="button" class="btn btn-sm btn-info" id="container-renew-btn" onclick="container_renew({{ challenge.id }})">
    <i class="fas fa-clock"></i> + Tempo
</button>
<button type="button" class="btn btn-sm btn-danger" id="container-stop-btn" onclick="container_stop({{ challenge.id }})">
    <i class="fas fa-stop"></i> Stop
</button>
            </div>
        </div>

        <div id="container-request-error" class="alert alert-danger text-center mt-2" role="alert" style="display: none;">
            <strong id="result-message">Errore</strong>
        </div>
    </div>
{% endblock %}
